<style>
  html, body { background: #0a0a0a; }
  html.light, html.light body { background: #fafafa; }
  * { -webkit-font-smoothing: antialiased; }
  body { font-family: Inter, system-ui, sans-serif; font-feature-settings: "cv11","ss01","ss03"; }
  /* hairline */
  .hr { border-color: rgba(255,255,255,0.08); }
  html.light .hr { border-color: rgba(0,0,0,0.10); }
  /* hide scrollbar chrome but keep functional */
  .nice-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
  .nice-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 999px; }
  .nice-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); }
  html.light .nice-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.10); }
  html.light .nice-scroll::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.20); }
  /* selection */
  ::selection { background: #f5d90a; color: #0a0a0a; }
  /* range input styling */
  input[type="range"] { -webkit-appearance: none; background: transparent; height: 14px; }
  input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: rgba(255,255,255,0.18); }
  html.light input[type="range"]::-webkit-slider-runnable-track { background: rgba(0,0,0,0.18); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; background: #f5d90a; border-radius: 0; margin-top: -4.5px; cursor: pointer; }
  /* tighter caret on inputs */
  input, textarea, select { caret-color: #f5d90a; }
  /* color input native chrome reset */
  input[type="color"] { -webkit-appearance: none; appearance: none; border: 0; background: transparent; padding: 0; cursor: pointer; }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch { border: 1px solid rgba(255,255,255,0.18); border-radius: 0; }
  html.light input[type="color"]::-webkit-color-swatch { border-color: rgba(0,0,0,0.18); }

</style>
<script>
  // set dark by default before paint

    try {
      var saved = localStorage.getItem('spec.theme');

</script>

function buildPrompt(s) {
  const out = [];
  const push = (...xs) => out.push(...xs);
  const sec = (title, body) => { if (body.length) { push(`## ${title}`, ...body, ''); } };

  push('# Design spec', '');

  if (s.brief.on) {
    const b = [];
    if (s.brief.product)    b.push(`- Product: ${s.brief.product}`);
    if (s.brief.audience)   b.push(`- Audience: ${s.brief.audience}`);
    if (s.brief.action)     b.push(`- Primary action: ${s.brief.action}`);
    if (s.brief.secondary)  b.push(`- Secondary action: ${s.brief.secondary}`);
    if (s.brief.constraints)b.push(`- Constraints: ${s.brief.constraints}`);
    sec('Brief', b);
  }

  if (s.aesthetic.on) {
    const v = s.aesthetic.value === 'Custom' ? (s.aesthetic.custom || 'Custom') : s.aesthetic.value;
    const b = [`- Direction: ${v}`];
    if (s.aesthetic.references) b.push(`- References: ${s.aesthetic.references}`);
    sec('Aesthetic', b);
  }

  if (s.typography.on) {
    const tf = s.typography.typeface === 'Custom' ? (s.typography.custom || 'Custom') : s.typography.typeface;
    sec('Typography', [
      `- Typeface: ${tf}`,
      `- Mono: ${s.typography.mono}`,
      `- Type scale: ${s.typography.scale}`,
      `- Heading weight: ${s.typography.heading}`,
      `- Body weight: ${s.typography.body}`,
      `- Line height: ${s.typography.leading}`,
      `- Tracking: ${s.typography.tracking}`,
      `- Case: ${s.typography.caseStyle}`,
      `- Numerics: ${s.typography.numerics}`,
    ]);
  }

  if (s.spacing.on) {
    sec('Spacing', [
      `- Base unit: ${s.spacing.base}`,
      `- Container: ${s.spacing.container === 'fluid' ? 'Fluid' : s.spacing.container + 'px'}`,
      `- Section rhythm: ${s.spacing.rhythm}`,
      `- Gutter: ${s.spacing.gutter}px`,
      `- Padding: ${s.spacing.padding}`,
    ]);
  }

  if (s.color.on) {
    sec('Color', [
      `- Palette: ${s.color.mode}`,
      `- Accent: ${s.color.accent}`,
      `- Secondary: ${s.color.secondary}`,
      `- Dark mode: ${s.color.dark}`,
      `- Surface: ${s.color.surface}`,
      `- Contrast: ${s.color.contrast}`,
      `- Temperature: ${s.color.temp}`,
      `- Background: ${s.color.bg}`,
    ]);
  }

  if (s.layout.on) {
    sec('Layout', [
      `- Grid: ${s.layout.grid}`,
      `- Hero: ${s.layout.hero}`,
      `- Nav: ${s.layout.nav}`,
      `- Above-fold: ${s.layout.fold}`,
    ]);
  }

  if (s.sections.on && s.sections.values.length) {
    sec('Page sections', s.sections.values.map(v => `- ${v}`));
  }

  if (s.components.on) {
    sec('Components', [
      `- Radius: ${s.components.radius === 'pill' ? 'Pill' : s.components.radius === 'mixed' ? 'Mixed' : s.components.radius + 'px'}`,
      `- Borders: ${s.components.border}`,
      `- Shadows: ${s.components.shadow}`,
      `- Buttons: ${s.components.button}`,
      `- Cards: ${s.components.card}`,
      `- Icons: ${s.components.icons}`,
    ]);
  }

  if (s.imagery.on) {
    sec('Imagery', [
      `- Style: ${s.imagery.style}`,
      `- Treatment: ${s.imagery.treatment}`,
      `- Aspect: ${s.imagery.aspect}`,
    ]);
  }

  if (s.motion.on) {
    sec('Motion', [
      `- Density: ${s.motion.density}`,
      `- Feel: ${s.motion.feel}`,
      `- Scroll: ${s.motion.scroll}`,
      `- Hover: ${s.motion.hover}`,
      `- Page transition: ${s.motion.transition}`,
    ]);
  }

  if (s.voice.on) {
    sec('Voice & copy', [
      `- Register: ${s.voice.register}`,
      `- Density: ${s.voice.density}`,
      `- Headline style: ${s.voice.headline}`,
      `- Person: ${s.voice.person}`,
      `- Formality: ${s.voice.formality}`,
    ]);
  }

  if (s.cta.on) {
    sec('CTAs', [
      `- Hierarchy: ${s.cta.hierarchy}`,
      `- Style: ${s.cta.style}`,
      `- Placement: ${s.cta.placement}`,
    ]);
  }

  if (s.trust.on && s.trust.values.length) {
    sec('Trust signals', s.trust.values.map(v => `- ${v}`));
  }

  if (s.forms.on) {
    sec('Forms', [
      `- Field treatment: ${s.forms.field}`,
      `- Validation: ${s.forms.validation}`,
      `- Density: ${s.forms.density}`,
    ]);
  }

  if (s.data.on) {
    sec('Data display', [
      `- Tables: ${s.data.table}`,
      `- Charts: ${s.data.chart}`,
      `- Empty states: ${s.data.empty}`,
    ]);
  }

  if (s.a11y.on) {
    sec('Accessibility', [
      `- Target: ${s.a11y.target}`,
      `- Focus style: ${s.a11y.focus}`,
      `- Motion: ${s.a11y.motion}`,
    ]);
  }

  if (s.perf.on) {
    sec('Performance', [
      `- Budget: ${s.perf.budget}`,
      `- Image loading: ${s.perf.images}`,
    ]);
  }

  if (s.footer.on) {
    sec('Footer', [`- Style: ${s.footer.value}`]);
  }

  if (s.stack.on) {
    sec('Stack', [
      `- Framework: ${s.stack.framework}`,
      `- Styling: ${s.stack.styling}`,
      `- Components: ${s.stack.library}`,
      `- Responsive: ${s.stack.responsive}`,
      `- Rendering: ${s.stack.rendering}`,
      `- State: ${s.stack.state}`,
    ]);
  }

  if (s.locale.on) {
    sec('Locale', [`- ${s.locale.value}`]);
  }

  if (s.anti.on && s.anti.values.length) {
    sec('Do not include', s.anti.values.map(v => `- ${v}`));
  }

  while (out.length && out[out.length-1] === '') out.pop();
  return out.join('\n');
}

function tokenCount(text) {
  // crude approximation: ~4 chars/token
  return Math.max(1, Math.round(text.length / 4));
}

function MultiChips({ options, values, onChange, stripPrefix }) {
  return (
    <div className="flex flex-wrap gap-1">
      {options.map(o => {
        const active = values.includes(o);
        return (
          <Chip key={o} active={active} onClick={() => {
            onChange(active ? values.filter(x => x !== o) : [...values, o]);
          }}>
            {stripPrefix ? o.replace(new RegExp('^' + stripPrefix), '') : o}
          </Chip>
        );
      })}
    </div>
  );
}

/* ------------------------------- TOOLTIP -------------------------------- */
function InfoTip({ title, body, examples }) {
  const [open, setOpen] = useState(false);
  const [coords, setCoords] = useState({ left: 0, top: 0, placement: 'right' });
  const ref = useRef(null);
  const timer = useRef(null);

  const show = () => {
    clearTimeout(timer.current);
    timer.current = setTimeout(() => {
      const el = ref.current; if (!el) return;
      const r = el.getBoundingClientRect();
      const TOOLTIP_W = 308;
      const vw = window.innerWidth, vh = window.innerHeight;
      let left = r.right + 10;
      let placement = 'right';
      if (left + TOOLTIP_W + 12 > vw) {
        left = r.left - TOOLTIP_W - 10;
        placement = 'left';
      }
      let top = r.top + r.height / 2;
      // clamp top so tooltip stays in viewport (assume ~140px tall)
      const APPROX_H = 160;
      top = Math.max(12 + APPROX_H/2, Math.min(vh - 12 - APPROX_H/2, top));
      setCoords({ left, top, placement });
      setOpen(true);
    }, 90);
  };
  const hide = () => {
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setOpen(false), 60);
  };

  return (
    <>
      <button
        type="button"
        ref={ref}
        onMouseEnter={show}
        onMouseLeave={hide}
        onFocus={show}
        onBlur={hide}
        onClick={(e) => e.stopPropagation()}
        aria-label={`About: ${title}`}
        className="w-4 h-4 inline-flex items-center justify-center border border-neutral-200/20 text-[9px] font-mono text-neutral-400 hover:border-yellow-300/70 hover:text-yellow-300 focus:outline-none focus-visible:border-yellow-300 focus-visible:text-yellow-300 transition-colors duration-75"
        style={{ borderRadius: 0 }}
        tabIndex={0}
      >i</button>
      {open && ReactDOM.createPortal(
        <div
          onMouseEnter={() => clearTimeout(timer.current)}
          onMouseLeave={hide}
          className="fixed z-50 pointer-events-auto"
          style={{
            left: coords.left,
            top: coords.top,
            transform: 'translateY(-50%)',
            width: 308,
          }}
        >
          {/* connector tick */}
          <div
            className="absolute w-2 h-px bg-yellow-300"
            style={{
              top: '50%',
              [coords.placement === 'right' ? 'left' : 'right']: -8,
              transform: 'translateY(-0.5px)',
            }}
          />
          <div className="bg-neutral-950 border border-neutral-200/20 light-tip-bg shadow-[0_0_0_1px_rgba(0,0,0,0.4)] light:shadow-none">
            <div className="border-b border-neutral-200/15 px-3 py-2 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="w-1.5 h-1.5 bg-yellow-300" />
                <span className="font-mono text-[10px] uppercase tracking-[0.14em] text-neutral-400">Section</span>
              </div>
              <span className="font-mono text-[10px] text-neutral-600">/help</span>
            </div>
            <div className="px-3 pt-2.5 pb-3">
              <div className="text-[12.5px] font-medium text-neutral-100 light-tip-h tracking-tight mb-1.5">{title}</div>
              <div className="text-[11.5px] leading-[1.55] text-neutral-400 light-tip-body">{body}</div>
              {examples && (
                <div className="mt-2.5 pt-2.5 border-t border-neutral-200/10">
                  <div className="text-[9px] font-mono uppercase tracking-[0.16em] text-neutral-600 mb-1">Affects</div>
                  <div className="text-[10.5px] font-mono text-neutral-500 leading-[1.55]">{examples}</div>
                </div>
              )}
            </div>
          </div>
        </div>,
        document.body
      )}
    </>
  );
}

function App() {
  const [state, setState] = useState(() => {
    try {
      const raw = localStorage.getItem('spec.state');
      if (raw) {
        const saved = JSON.parse(raw);
        // deep-merge per-section so old saved state still gets new fields
        const merged = { ...initialState };
        for (const k of Object.keys(initialState)) {
          merged[k] = { ...initialState[k], ...(saved[k] || {}) };
        }
        return merged;
      }
    } catch (e) {}
    return initialState;
  });
  const [openMap, setOpenMap] = useState(() => {
    try {
      const raw = localStorage.getItem('spec.open');
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return {};
  });
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('spec.theme') || 'dark'; } catch(e) { return 'dark'; }
  });
  const [copied, setCopied] = useState(false);
  const [flash, setFlash] = useState(false);
  const previewRef = useRef(null);

  /* persist */
  useEffect(() => {
    try { localStorage.setItem('spec.state', JSON.stringify(state)); } catch (e) {}
  }, [state]);
  useEffect(() => {
    try { localStorage.setItem('spec.open', JSON.stringify(openMap)); } catch (e) {}
  }, [openMap]);
  useEffect(() => {
    try { localStorage.setItem('spec.theme', theme); } catch (e) {}
    if (theme === 'light') document.documentElement.classList.add('light');
    else document.documentElement.classList.remove('light');
  }, [theme]);

  const prompt = useMemo(() => buildPrompt(state), [state]);
  const tokens = useMemo(() => tokenCount(prompt), [prompt]);
  const lineCount = useMemo(() => prompt.split('\n').length, [prompt]);

  /* flash on change */
  const lastPromptRef = useRef(prompt);
  useEffect(() => {
    if (lastPromptRef.current !== prompt) {
      setFlash(true);
      const t = setTimeout(() => setFlash(false), 120);
      lastPromptRef.current = prompt;
      return () => clearTimeout(t);
    }
  }, [prompt]);

  const copy = useCallback(async () => {
    try {
      await navigator.clipboard.writeText(prompt);
    } catch (e) {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = prompt; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch(e){}
      ta.remove();
    }
    setCopied(true);
    setTimeout(() => setCopied(false), 900);
  }, [prompt]);

  /* ⌘C / Ctrl+C global — only when nothing selected */
  useEffect(() => {
    function onKey(e) {
      const isMeta = e.metaKey || e.ctrlKey;
      if (!isMeta) return;
      if (e.key.toLowerCase() !== 'c') return;
      const sel = window.getSelection();
      if (sel && sel.toString().length > 0) return; // let normal copy work
      const t = e.target;
      const tag = (t && t.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || (t && t.isContentEditable)) return;
      e.preventDefault();
      copy();
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [copy]);

  const update = (key, patch) => setState(s => ({ ...s, [key]: { ...s[key], ...patch } }));
  const toggle = (key) => setState(s => ({ ...s, [key]: { ...s[key], on: !s[key].on } }));

          <Section id="anti" n={19} title="Anti-patterns" on={state.anti.on} onToggle={() => toggle('anti')} hint={hint.anti} openMap={openMap} setOpenMap={setOpenMap}>
            <FieldLabel hint={`multi-select · ${ANTI_PATTERNS.length} options`}>Do not include</FieldLabel>
            <MultiChips options={ANTI_PATTERNS} values={state.anti.values} onChange={v => update('anti', { values: v })} stripPrefix="No " />
          </Section>

          {/* Section: Stack */}
          <Section id="stack" n={20} title="Stack" on={state.stack.on} onToggle={() => toggle('stack')} hint={hint.stack} openMap={openMap} setOpenMap={setOpenMap}>
            <div>
              <FieldLabel>Framework</FieldLabel>
              <ChipRow options={FRAMEWORKS} value={state.stack.framework} onChange={v => update('stack', { framework: v })} />
            </div>
            <div>
              <FieldLabel>Styling</FieldLabel>
              <ChipRow options={STYLING} value={state.stack.styling} onChange={v => update('stack', { styling: v })} />
            </div>
            <div>
              <FieldLabel>Component library</FieldLabel>
              <ChipRow options={LIBRARIES} value={state.stack.library} onChange={v => update('stack', { library: v })} />
            </div>
            <div>
              <FieldLabel>Responsive target</FieldLabel>
              <ChipRow options={RESPONSIVE} value={state.stack.responsive} onChange={v => update('stack', { responsive: v })} />
            </div>
            <div>
              <FieldLabel>Rendering</FieldLabel>
              <ChipRow options={RENDERING} value={state.stack.rendering} onChange={v => update('stack', { rendering: v })} />
            </div>
            <div>
              <FieldLabel>State management</FieldLabel>
              <ChipRow options={STATE_MGMT} value={state.stack.state} onChange={v => update('stack', { state: v })} />
            </div>
          </Section>

          {/* Section: Locale */}
          <Section id="locale" n={21} title="Locale" on={state.locale.on} onToggle={() => toggle('locale')} hint={hint.locale} openMap={openMap} setOpenMap={setOpenMap}>
            <div>
              <FieldLabel>Target locale</FieldLabel>
              <ChipRow options={LOCALE} value={state.locale.value} onChange={v => update('locale', { value: v })} />
            </div>
          </Section>

          {/* footer space */}
          <div className="h-16" />
        </aside>

        {/* RIGHT — PROMPT PREVIEW */}
        <section className="relative min-h-0 flex flex-col bg-neutral-950 light-bg-card">
          <div className="h-10 flex items-center justify-between border-b hr px-4 shrink-0">
            <div className="flex items-center gap-3 text-[11px] font-mono text-neutral-500">
              <span className="text-neutral-300">prompt.md</span>
              <span>·</span>
              <span className="tabular-nums">{lineCount} ln</span>
              <span>·</span>
              <span className="tabular-nums">~{tokens} tok</span>
              <span className={['inline-block w-1.5 h-1.5 transition-opacity duration-100', flash ? 'opacity-100 bg-yellow-300' : 'opacity-0 bg-yellow-300'].join(' ')} />
            </div>
            <div className="flex items-center gap-2">
              <kbd className="hidden md:inline-flex items-center h-6 px-1.5 border border-neutral-200/15 text-[10px] font-mono text-neutral-500">⌘C</kbd>
              <button
                type="button"
                onClick={copy}
                className={[
                  'h-7 px-3 text-[11px] font-mono uppercase tracking-[0.14em] border transition-colors duration-75',
                  copied
                    ? 'bg-yellow-300 text-neutral-950 border-yellow-300'
                    : 'bg-neutral-100/0 border-neutral-200/30 text-neutral-100 hover:bg-yellow-300 hover:text-neutral-950 hover:border-yellow-300',
                ].join(' ')}
              >
                {copied ? 'Copied' : 'Copy'}
              </button>
            </div>
          </div>

          <div ref={previewRef} className="flex-1 min-h-0 overflow-auto nice-scroll">
            <PromptView text={prompt} />
          </div>

          {/* status bar */}
          <div className="h-7 border-t hr px-4 flex items-center justify-between text-[10px] font-mono text-neutral-500 shrink-0">
            <div className="flex items-center gap-3">
              <span>spec/0.1</span>
              <span className="text-neutral-700">·</span>
              <span>{Object.values(state).filter(s => s.on).length}/{Object.keys(state).length} sections active</span>
            </div>
            <div className="flex items-center gap-3">
              <span>localstorage:saved</span>
              <span className="text-neutral-700">·</span>
              <span>utf-8</span>
            </div>
          </div>
        </section>
      </main>

      {/* light mode patches via CSS-in-JSX */}
      <style>{`
        html.light .light-text-fix, html.light .text-neutral-100 { color: #0a0a0a; }
        html.light .text-neutral-200 { color: #171717; }
        html.light .text-neutral-300 { color: #404040; }
        html.light .text-neutral-500 { color: #737373; }
        html.light .text-neutral-600 { color: #525252; }
        html.light .text-neutral-700 { color: #a3a3a3; }
        html.light .bg-neutral-950, html.light .light-bg-card { background: #ffffff; }
        html.light .light-tip-bg { background: #ffffff !important; }
        html.light .light-tip-h { color: #0a0a0a !important; }
        html.light .light-tip-body { color: #404040 !important; }
        html.light body { background: #fafafa; }
        html.light .light-input { color: #0a0a0a; }
        html.light .border-neutral-200\\/15 { border-color: rgba(0,0,0,0.12); }
        html.light .border-neutral-200\\/30 { border-color: rgba(0,0,0,0.22); }
        html.light .border-neutral-200\\/35 { border-color: rgba(0,0,0,0.28); }
        html.light .border-neutral-200\\/40 { border-color: rgba(0,0,0,0.32); }
        html.light .hover\\:border-neutral-200\\/40:hover { border-color: rgba(0,0,0,0.40); }
        html.light .hover\\:border-neutral-200\\/35:hover { border-color: rgba(0,0,0,0.35); }
        html.light .hover\\:text-white:hover { color: #0a0a0a; }
        html.light .bg-neutral-200\\/15, html.light .bg-neutral-200\\/15 { background: rgba(0,0,0,0.12); }
        html.light kbd { color: #525252; }
      `}</style>
    </div>
  );
}

function TextField({ label, placeholder, value, onChange }) {
  return (
    <label className="block">
      <FieldLabel>{label}</FieldLabel>
      <input
        type="text"
        value={value}
        placeholder={placeholder}
        onChange={e => onChange(e.target.value)}
        className="w-full h-8 bg-transparent border border-neutral-200/15 px-2.5 text-[12.5px] text-neutral-100 placeholder:text-neutral-600 focus:border-yellow-300/70 focus:outline-none light-input"
        style={{ borderRadius: 0 }}
      />
    </label>
  );
}

/* Syntax-tinted prompt rendering — keep monospace. */
function PromptView({ text }) {
  const lines = text.split('\n');
  return (
    <pre className="font-mono text-[12.5px] leading-[1.65] px-6 py-5 whitespace-pre-wrap break-words m-0 select-text">
      {lines.map((ln, i) => {
        let cls = 'text-neutral-300 light:text-neutral-700';
        let content = ln;
        if (/^# /.test(ln))         cls = 'text-neutral-100 font-semibold';
        else if (/^## /.test(ln))   cls = 'text-yellow-300';
        else if (/^- /.test(ln)) {
          // split key:value
          const m = ln.match(/^- ([^:]+):\s*(.*)$/);
          if (m) {
            return (
              <div key={i} className="text-neutral-300">
                <span className="text-neutral-600">- </span>
                <span className="text-neutral-500">{m[1]}: </span>
                <span className="text-neutral-100">{m[2]}</span>
              </div>
            );
          }
          return (
            <div key={i} className="text-neutral-300">
              <span className="text-neutral-600">- </span>
              <span className="text-neutral-100">{ln.slice(2)}</span>
            </div>
          );
        }
        return <div key={i} className={cls}>{content || '\u00A0'}</div>;
      })}
    </pre>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
